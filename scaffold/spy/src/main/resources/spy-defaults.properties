# Shared workshop defaults. Application properties, environment variables and CLI arguments override these.
server.port=8080
# Use a streaming imperative transport even when Reactor Netty is on the Spring AI classpath.
spring.http.clients.imperative.factory=jdk
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.4-mini
spring.ai.openai.base-url=http://127.0.0.1:${server.port}/spy/proxy/openai/v1
spy.providers.openai=https://api.openai.com
spy.max-exchanges=100
spy.max-body-bytes=262144
spy.tracing.enabled=true
spy.tracing.max-invocations=100
spy.tracing.max-spans=300
